name: Update Component Registry

on:
  push:
    branches: [main]
    paths:
      - 'components/ui/**'

jobs:
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD and HEAD~1 to diff

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Detect changed components
        id: changed
        run: |
          # Get files changed in this push (HEAD vs HEAD~1)
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'components/ui/')

          # Extract unique component folder names
          # components/ui/Button/Button.tsx → Button
          COMPONENTS=$(echo "$CHANGED_FILES" \
            | grep -oP 'components/ui/\K[^/]+' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//')

          echo "components=$COMPONENTS" >> $GITHUB_OUTPUT
          echo "Changed components: $COMPONENTS"

      - name: Bump component versions in registry
        if: steps.changed.outputs.components != ''
        run: |
          npx tsx scripts/bump-component-versions.ts \
            --sha "${{ github.sha }}" \
            --message "${{ github.event.head_commit.message }}" \
            --components "${{ steps.changed.outputs.components }}"

      - name: Commit updated registry
        if: steps.changed.outputs.components != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if registry.json actually changed
          if git diff --quiet registry.json; then
            echo "registry.json unchanged — nothing to commit"
            exit 0
          fi

          git add registry.json
          git commit -m "chore(registry): bump versions for ${{ steps.changed.outputs.components }}"
          git push
